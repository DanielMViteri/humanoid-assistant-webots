# Shared runtime configuration for local tooling.
# Keep venv names and base Python specs here so wrapper scripts stay in sync.

# Main app venv: has streamlit + pymongo + python-dotenv + dnspython.
# dnspython is REQUIRED for the Atlas mongodb+srv URI; without it db_queries
# silently falls back to localhost and the dashboard stops reaching Atlas.
MAIN_VENV=.venv

PERCEPTION_VENV=.venv-perception311
PERCEPTION_PYTHON_SPEC=3.11

DEEPFACE_VENV=.venv-deepface310
DEEPFACE_PYTHON_SPEC=3.10
